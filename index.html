<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hypersitition</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0c0c0c;
        color: #d7d1c6;
        font: 16px/1.5 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      main {
        min-height: 100vh;
        padding: 1.4rem 1.2rem;
      }
      .prompt { color: #c4a15a; }
      .cursor {
        display: inline-block;
        width: 0.6ch;
        height: 1em;
        background: #d7d1c6;
        transform: translateY(0.15em);
        margin-left: 0.15ch;
      }
      @media (prefers-reduced-motion: no-preference) {
        .cursor { animation: blink 1.1s steps(1) infinite; }
      }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <main>
      <div><span class="prompt">&gt;</span> coming soon for agent swarms<span class="cursor"></span></div>
    </main>
  </body>
</html>
